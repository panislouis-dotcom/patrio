name: Deploy QA Health Check

on:
  workflow_run:
    workflows: ["Deploy QA"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: deploy-qa-health-check-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  health-check:
    name: Verify QA deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      QA_APP_URL: https://qa.admin.refigan.com
      EDG_INFRA_REPOSITORY: ${{ github.repository_owner }}/edg-infra
      EDG_INFRA_BRANCH: qa
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}

    steps:
      - name: Resolve PR or create issue for comment target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          pulls_json="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPOSITORY}/commits/${DEPLOYED_SHA}/pulls"
          )"

          pr_number="$(jq -r '.[0].number // empty' <<<"$pulls_json")"

          if [[ -n "$pr_number" ]]; then
            echo "kind=pr" >>"$GITHUB_OUTPUT"
            echo "number=$pr_number" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          issue_json="$(
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPOSITORY}/issues" \
              -f "title=QA deploy health check for ${DEPLOYED_SHA:0:7}" \
              -f "body=Tracking QA health check for commit ${DEPLOYED_SHA}. No associated PR was found."
          )"
          issue_number="$(jq -r '.number' <<<"$issue_json")"

          echo "kind=issue" >>"$GITHUB_OUTPUT"
          echo "number=$issue_number" >>"$GITHUB_OUTPUT"

      - name: Wait for ArgoCD Image Updater commit on edg-infra
        id: infra
        env:
          GH_TOKEN: ${{ secrets.EDG_INFRA_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "EDG_INFRA_TOKEN secret is required to read ${EDG_INFRA_REPOSITORY}." >&2
            exit 1
          fi

          deadline=$((SECONDS + 300))
          deploy_completed_epoch="$(date -u -d "$DEPLOY_COMPLETED_AT" +%s)"

          while (( SECONDS < deadline )); do
            commit_json="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${EDG_INFRA_REPOSITORY}/commits/${EDG_INFRA_BRANCH}"
            )"

            commit_sha="$(jq -r '.sha' <<<"$commit_json")"
            commit_date="$(jq -r '.commit.committer.date // .commit.author.date' <<<"$commit_json")"
            commit_epoch="$(date -u -d "$commit_date" +%s)"
            commit_blob="$(jq -r '(.commit.author.name // "") + " " + (.commit.author.email // "") + " " + (.commit.message // "")' <<<"$commit_json" | tr '[:upper:]' '[:lower:]')"

            if (( commit_epoch >= deploy_completed_epoch )) && grep -Eq 'argocd.?image.?updater|image updater' <<<"$commit_blob"; then
              echo "sha=$commit_sha" >>"$GITHUB_OUTPUT"
              echo "date=$commit_date" >>"$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for Image Updater commit; current head ${commit_sha} from ${commit_date}."
            sleep 15
          done

          echo "Timed out after 300 s waiting for Image Updater commit on ${EDG_INFRA_REPOSITORY}@${EDG_INFRA_BRANCH}." >&2
          exit 1

      - name: Poll QA /api/version until new SHA is live
        id: version_check
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 600))

          while (( SECONDS < deadline )); do
            response="$(curl -sf --max-time 10 "${QA_APP_URL}/api/version" 2>/dev/null || true)"

            if [[ -n "$response" ]]; then
              running_sha="$(jq -r '.sha // empty' <<<"$response" 2>/dev/null || true)"
              if [[ "$running_sha" == "$DEPLOYED_SHA" ]]; then
                echo "running_sha=$running_sha" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              echo "QA is serving sha=${running_sha:-unknown}; waiting for ${DEPLOYED_SHA}."
            else
              echo "QA /api/version not reachable yet (pod restarting or sync in progress)."
            fi

            sleep 20
          done

          final_sha="$(curl -sf --max-time 10 "${QA_APP_URL}/api/version" 2>/dev/null | jq -r '.sha // "unreachable"' 2>/dev/null || echo 'unreachable')"
          echo "running_sha=$final_sha" >>"$GITHUB_OUTPUT"
          echo "Timed out after 600 s. QA never served ${DEPLOYED_SHA}." >&2
          exit 1

      - name: Post success comment
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          INFRA_SHA: ${{ steps.infra.outputs.sha }}
          RUNNING_SHA: ${{ steps.version_check.outputs.running_sha }}
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          cat >"$body_file" <<EOF
          ### QA deploy passed

          | Field | Value |
          |---|---|
          | Commit | \`${DEPLOYED_SHA:0:7}\` |
          | Image Updater commit | \`${INFRA_SHA}\` |
          | Running SHA | \`${RUNNING_SHA}\` |
          EOF

          if [[ "$TARGET_KIND" == "pr" ]]; then
            gh pr comment "$TARGET_NUMBER" --repo "$REPOSITORY" --body-file "$body_file"
          else
            gh issue comment "$TARGET_NUMBER" --repo "$REPOSITORY" --body-file "$body_file"
          fi

      - name: Post failure comment
        if: ${{ failure() && steps.target.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_KIND: ${{ steps.target.outputs.kind }}
          TARGET_NUMBER: ${{ steps.target.outputs.number }}
          INFRA_SHA: ${{ steps.infra.outputs.sha }}
          RUNNING_SHA: ${{ steps.version_check.outputs.running_sha }}
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          cat >"$body_file" <<EOF
          ### QA deploy failed

          | Field | Value |
          |---|---|
          | Commit | \`${DEPLOYED_SHA:0:7}\` |
          | Image Updater commit | \`${INFRA_SHA:-not detected}\` |
          | Running SHA | \`${RUNNING_SHA:-unknown}\` |

          QA did not serve the new SHA within 10 minutes after the Image Updater commit.
          Check ArgoCD for PreSync (migration) failures: a failed migrate Job blocks the sync.
          EOF

          if [[ "$TARGET_KIND" == "pr" ]]; then
            gh pr comment "$TARGET_NUMBER" --repo "$REPOSITORY" --body-file "$body_file"
          else
            gh issue comment "$TARGET_NUMBER" --repo "$REPOSITORY" --body-file "$body_file"
          fi
