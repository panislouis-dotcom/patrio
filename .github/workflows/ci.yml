name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        run: cd apps/web && npm ci
      - name: Type check
        run: cd apps/web && npx tsc --noEmit

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: refigan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_test
      PYTHONPATH: ".:apps"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip install -r apps/api/requirements.txt
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64 -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate
      - name: Generate CI secrets
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run API tests
        run: python -m pytest apps/api/tests/ -q

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: refigan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # ── API setup ────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip install -r apps/api/requirements.txt
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64 -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate
      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e?sslmode=disable
        run: dbmate --migrations-dir db/migrations --no-dump-schema up
      - name: Seed e2e test user
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e
          E2E_USER: test@refigan.com
          E2E_PASS: testpassword
        run: python scripts/seed-e2e-user.py
      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e
          ALLOWED_ORIGINS: http://localhost:5173
          PYTHONPATH: apps
          ANTHROPIC_API_KEY: ci-placeholder-key
        run: JWT_SECRET=$(openssl rand -hex 32) uvicorn api.main:app --host 0.0.0.0 --port 8000 &
      - name: Wait for API
        run: bash scripts/wait-for-api.sh http://localhost:8000/health

      # ── Web setup ────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/e2e/package-lock.json
      - name: Build web app
        run: cd apps/web && npm ci && npm run build
      - name: Start Vite preview
        run: cd apps/web && npx vite preview --host 0.0.0.0 --port 5173 &
      - name: Wait for web
        run: npx wait-on http://localhost:5173 --timeout 15000

      # ── Playwright ──────────────────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package-lock.json') }}
      - name: Install E2E deps
        run: cd apps/e2e && npm ci
      - name: Install Playwright browsers
        run: cd apps/e2e && npx playwright install --with-deps chromium
      - name: Run E2E tests
        env:
          E2E_USER: test@refigan.com
          E2E_PASS: testpassword
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e
        run: cd apps/e2e && npm test

      # ── Reports ─────────────────────────────────────────────────────
      - name: Upload test results (videos / traces)
        id: pw_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/e2e/test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Playwright HTML report
        id: pw_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: warn
      - name: E2E summary comment
        if: always() && github.event_name == 'pull_request'
        uses: daun/playwright-report-summary@v4
        with:
          report-file: apps/e2e/test-results/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report links comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-report-links
          message: |
            ### Resultados E2E
            | Artefacto | Enlace | Contenido |
            |---|---|---|
            | **Reporte HTML** | [⬇ Descargar](${{ steps.pw_report.outputs.artifact-url }}) | Descomprime → abre `index.html` |
            | **Videos / Trazas** | [⬇ Descargar](${{ steps.pw_results.outputs.artifact-url }}) | Videos de pruebas fallidas |

            > Artefactos expiran en 14 días.
