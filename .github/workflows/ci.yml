name: CI

on:
  pull_request: {}
  push:
    branches: [main, qa]

permissions:
  contents: read
  pull-requests: write

jobs:
  migrate-smoke:
    name: Migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: refigan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d refigan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64 -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate
      - name: Run DB migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/refigan_test?sslmode=disable  # ggignore
        run: dbmate --migrations-dir db/migrations --no-dump-schema up
      - name: Lint migration idempotency
        run: |
          bad=$(grep -rEin "^\s*CREATE (TABLE|UNIQUE INDEX|INDEX)\b" db/migrations/ | grep -iv "IF NOT EXISTS" || true)
          if [ -n "$bad" ]; then
            echo "Non-idempotent DDL found — add IF NOT EXISTS to each:" >&2
            echo "$bad" >&2
            exit 1
          fi

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: [migrate-smoke]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - name: Install web deps
        run: cd app/web && npm ci
      - name: Type check
        run: cd app/web && npx tsc --noEmit

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: [migrate-smoke]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: refigan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_test
      PYTHONPATH: ".:app"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip install -r app/api/requirements.txt
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64 -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate
      - name: Generate CI secrets
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # El prospecto dibuja los planos evaluando un bundle de TypeScript en Chromium
      # (api/lib/plano_js.py). Sin estos tres pasos, test_plano_js.py se SALTA en CI por
      # falta de bundle — y es la única prueba de toda la suite que carga el bundle real
      # en un navegador real. Saltándose, un bundle roto pasa el pipeline en verde y el
      # prospecto sale a producción sin planos, en silencio. Ese es justo el modo de falla
      # que esa prueba existe para cazar, así que aquí tiene que correr de verdad.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - name: Build the plano bundle
        run: cd app/web && npm ci && npm run build:plano && mkdir -p ../api/assets && cp dist-plano/plano.iife.js ../api/assets/plano.iife.js
      - name: Install Chromium for the plano/PDF renderer
        run: python -m playwright install --with-deps chromium
      - name: Run API tests
        run: python -m pytest app/api/tests/ -q

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [migrate-smoke, typecheck]
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: refigan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # ── API setup ────────────────────────────────────────────────────
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: pip install -r app/api/requirements.txt
      - name: Install dbmate
        run: |
          curl -fsSL https://github.com/amacneil/dbmate/releases/download/v2.33.0/dbmate-linux-amd64 -o /usr/local/bin/dbmate
          chmod +x /usr/local/bin/dbmate
      - name: Generate CI secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_PASS=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e?sslmode=disable
        run: dbmate --migrations-dir db/migrations --no-dump-schema up
      - name: Seed e2e test user
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e
          E2E_USER: test@refigan.com
        run: python scripts/seed-e2e-user.py
      - name: Start API server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e
          ALLOWED_ORIGINS: http://localhost:5173
          PYTHONPATH: app
          ANTHROPIC_API_KEY: ci-placeholder-key
          FILES_ROOT: /tmp/refigan-files
        run: uvicorn api.main:app --host 0.0.0.0 --port 8000 &
      - name: Wait for API
        run: bash scripts/wait-for-api.sh http://localhost:8000/health

      # ── Web setup ────────────────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            app/web/package-lock.json
            app/e2e/package-lock.json
      - name: Build web app
        run: cd app/web && npm ci && npm run build
      - name: Start Vite preview
        run: cd app/web && npx vite preview --host 0.0.0.0 --port 5173 &
      - name: Wait for web
        run: npx wait-on http://localhost:5173 --timeout 15000

      # ── Playwright ──────────────────────────────────────────────────
      # Dos Playwright distintos viven en este job y cada uno necesita SU
      # Chromium: el de Node maneja el navegador de las pruebas, y el de Python
      # —dentro del API— es el que imprime el prospecto en PDF. Cada versión de
      # Playwright fija un build propio (1.59 de Node pide chromium-1217; 1.62
      # de Python pide otro), así que instalar uno no sirve para el otro.
      #
      # Que faltara el de Python no rompía nada visible: el endpoint del PDF
      # devolvía error, el navegador nunca disparaba la descarga, y la prueba
      # moría por timeout a los 20s — un síntoma que no nombra su causa. En
      # local pasaba porque una máquina de trabajo acumula builds de versiones
      # viejas y alguno servía. El Dockerfile ya hacía esto bien; CI no.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/e2e/package-lock.json', 'app/api/requirements.txt') }}
      - name: Install E2E deps
        run: cd app/e2e && npm ci
      - name: Install Playwright browsers (Node — el navegador de las pruebas)
        run: cd app/e2e && npx playwright install --with-deps chromium
      - name: Install Playwright browsers (Python — el que imprime el PDF)
        run: python -m playwright install --with-deps chromium
      - name: Run E2E tests
        env:
          E2E_USER: test@refigan.com
          E2E_API_BASE_URL: http://localhost:8000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/refigan_e2e
        run: cd app/e2e && npm test

      # ── Reports ─────────────────────────────────────────────────────
      - name: Upload test results (videos / traces)
        id: pw_results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-test-results
          path: app/e2e/test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Playwright HTML report
        id: pw_report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report
          path: app/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: warn
      - name: E2E summary comment
        if: always() && github.event_name == 'pull_request'
        uses: daun/playwright-report-summary@8bb85779022480a59ed8d33d9a4b8bda1c67666b  # v4
        with:
          report-file: app/e2e/test-results/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report links comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405  # v2.9.4
        with:
          header: e2e-report-links
          message: |
            ### Resultados E2E — Run #${{ github.run_number }}
            | Artefacto | Enlace | Contenido |
            |---|---|---|
            | **Reporte HTML** | [⬇ Descargar](${{ steps.pw_report.outputs.artifact-url }}) | Descomprime → abre `index.html` |
            | **Videos / Trazas** | [⬇ Descargar](${{ steps.pw_results.outputs.artifact-url }}) | Videos de pruebas fallidas |

            > Artefactos expiran en 14 días. · [Ver ejecución](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
