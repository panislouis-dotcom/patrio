name: Deploy QA

on:
  push:
    branches: [qa]

# Build + push QA image, then promote qa→main so ArgoCD deploys to prod.
# promote-to-prod.yml was removed: workflow_run only fires from the default
# branch, so a standalone promote workflow can never bootstrap itself onto main.
# Folding promote into this file (which already lives on qa) avoids that trap.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59  # v6.1.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419  # v2.1.5

      - name: Build and push
        env:
          IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/edg/refigan
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg APP_VERSION="$SHA" -t "$IMAGE:qa-$SHA" .
          docker push "$IMAGE:qa-$SHA"

  promote:
    name: Promote qa → main
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Fetch branches
        working-directory: repo
        run: git fetch origin

      - name: Show commits being promoted
        working-directory: repo
        run: |
          echo "Commits being promoted from qa to main:"
          git log --oneline origin/main..origin/qa

      - name: Fast-forward main to qa
        working-directory: repo
        run: |
          git checkout main
          if ! git merge --ff-only origin/qa; then
            echo "ERROR: qa is not ahead of main or has diverged. Rebase qa onto main before promoting." >&2
            exit 1
          fi

      - name: Push main
        working-directory: repo
        run: git push origin main
