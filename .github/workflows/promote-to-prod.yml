name: Promote QA to Prod

on:
  workflow_run:
    workflows: ["Deploy QA"]
    types: [completed]
    branches: [qa]

# Push qa→main to trigger the existing Deploy workflow (prod).
permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    # Only promote when the QA deploy actually succeeded.
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Fetch branches
        working-directory: repo
        run: git fetch origin

      - name: Show commits being promoted
        working-directory: repo
        run: |
          echo "Commits being promoted from qa to main:"
          git log --oneline origin/main..origin/qa

      - name: Fast-forward main to qa
        working-directory: repo
        run: |
          git checkout main
          if ! git merge --ff-only origin/qa; then
            echo "ERROR: qa is not ahead of main or has diverged. Rebase qa onto main before promoting." >&2
            exit 1
          fi

      - name: Push main
        working-directory: repo
        run: git push origin main
