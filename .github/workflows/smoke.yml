name: Smoke (Prod)

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Prod smoke tests
    runs-on: ubuntu-latest
    # Only run when the Deploy workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/e2e/package-lock.json

      - name: Install E2E deps
        run: cd apps/e2e && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package-lock.json') }}

      - name: Install Playwright browsers
        run: cd apps/e2e && npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          BASE_URL: https://admin.refigan.com
          API_BASE_URL: https://admin.refigan.com
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: cd apps/e2e && npx playwright test tests/00-smoke.spec.ts

      - name: Upload smoke report
        id: smoke_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: apps/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Post commit comment
        if: always()
        uses: peter-evans/commit-comment@v3
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_URL: ${{ steps.smoke_report.outputs.artifact-url }}
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          body: |
            ### Smoke tests — ${{ job.status == 'success' && 'PASSED' || 'FAILED' }}

            Triggered by deploy of `${{ github.event.workflow_run.head_sha }}` to [admin.refigan.com](https://admin.refigan.com).

            | | |
            |---|---|
            | **Status** | `${{ job.status }}` |
            | **Report** | [Download artifact](${{ steps.smoke_report.outputs.artifact-url }}) |

            Artifact expires in 7 days.
