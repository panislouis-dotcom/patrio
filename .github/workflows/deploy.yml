name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59  # v6.1.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419  # v2.1.5

      # Also tags qa-<sha>: ArgoCD Image Updater on the QA cluster watches for that
      # pattern and writes the new tag back to edg-infra's qa branch, so every merge to
      # main auto-deploys to QA (patrio has no separate qa branch to gate on).
      - name: Build and push
        env:
          IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/edg/refigan
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg APP_VERSION="$SHA" -t "$IMAGE:$SHA" -t "$IMAGE:latest" -t "$IMAGE:qa-$SHA" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:qa-$SHA"

  # Sin esto, un PreSync hook atorado en el cluster (el fallo real detrás del
  # incidente del 2026-08-19: refigan-migrate se quedó esperando un lock sin
  # lock_timeout, congeló el sync de prod, y nadie se dio cuenta hasta que se
  # notó a mano 15+ minutos después) deja el workflow en verde aunque prod
  # nunca se haya movido — ArgoCD Image Updater ya escribió el tag nuevo en
  # git en minutos, así que "el build pasó" no prueba que la app en vivo lo
  # sirva. Solo prod: qa vive detrás de `vpnOnly: true`
  # (edg-infra/k8s/apps/qa/refigan/values.yaml) — un runner de GitHub Actions,
  # sin VPN, no puede alcanzarlo, y no hay forma honesta de verificarlo desde aquí.
  verify-prod-live:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Poll prod until it serves this sha
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          got=""
          for i in $(seq 1 40); do
            got=$(curl -fsS --max-time 10 https://admin.refigan.com/api/version \
                  | grep -o '"sha":"[a-f0-9]*"' | cut -d'"' -f4 || true)
            if [ "$got" = "$SHA" ]; then
              echo "prod is live at $SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::prod never picked up $SHA (still at '${got:-unknown}' after 10 minutes)." \
               "The image was built and ArgoCD Image Updater normally writes the new tag to" \
               "edg-infra within a few minutes — this usually means the refigan-migrate PreSync" \
               "hook is stuck or failing on the prod cluster and blocking the sync." >&2
          exit 1
