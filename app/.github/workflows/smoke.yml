name: Smoke (Prod)

# Post-deploy verification for prod: confirm the freshly built commit is
# actually live and healthy. "Deploy" only builds/pushes the image; ArgoCD
# rolls it out asynchronously, so we poll /api/version until it serves the
# deployed SHA, then assert /health. Functional/UI coverage lives in ci.yml
# (full e2e on every PR) — this only answers "did the new version come up?".

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-prod-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify prod deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://admin.refigan.com
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Wait for the deployed SHA to go live, then check health
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            running_sha="$(curl -sf --max-time 10 "${PROD_URL}/api/version" 2>/dev/null | jq -r '.sha // empty' 2>/dev/null || true)"
            if [[ "$running_sha" == "$DEPLOYED_SHA" ]]; then
              echo "Prod is serving ${DEPLOYED_SHA}."
              health_status="$(curl -sf --max-time 10 "${PROD_URL}/health" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)"
              if [[ "$health_status" == "ok" ]]; then
                echo "Health OK — prod deploy verified."
                exit 0
              fi
              echo "Version is live but /health returned '${health_status:-unreachable}'." >&2
              exit 1
            fi
            echo "Prod serving sha=${running_sha:-unknown}; waiting for ${DEPLOYED_SHA}."
            sleep 20
          done

          echo "Timed out after 600 s: prod never served ${DEPLOYED_SHA}." >&2
          echo "Check ArgoCD for a failed PreSync (migrate) Job — it blocks the sync." >&2
          exit 1
